worker_processes 1;

events {
	worker_connections 16384;
}

http {
	access_log off;

	upstream api {
		# max_fails=0: com unix socket, fila cheia recusa na hora; sem isso o nginx tira a api de rotacao por 10s
		server unix:/sock/api1.sock max_fails=0;
		server unix:/sock/api2.sock max_fails=0;
	}

	server {
		listen 9999 backlog=4096;

		location / {
			proxy_pass http://api;
		}
	}
}
