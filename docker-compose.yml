services:
  api1: &api
    image: bef-api
    build: .
    environment:
      - DB_HOST=postgres
      - SOCKET=/sock/api1.sock
    volumes:
      - sockets:/sock
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "[ -S \"$$SOCKET\" ]"]
      interval: 5s
      start_period: 30s
      start_interval: 1s
    deploy:
      resources:
        limits:
          cpus: "0.225"
          memory: "50MB"

  api2:
    <<: *api
    environment:
      - DB_HOST=postgres
      - SOCKET=/sock/api2.sock

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "250MB"

  nginx:
    image: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - sockets:/sock
    ports:
      - "${PORTA:-9999}:9999"
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "200MB"

volumes:
  sockets:
